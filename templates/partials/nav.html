<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="/" aria-label="{{ profile.short_name }} — home">
      <span class="brand-mark" aria-hidden="true">AR</span>
      <span class="brand-text">{{ profile.short_name }}</span>
    </a>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-controls="site-nav">
    <label for="nav-toggle" class="nav-toggle-label">
      <span class="nav-toggle-bars" aria-hidden="true"></span>
      <span class="visually-hidden">Menu</span>
    </label>

    <nav id="site-nav" class="site-nav" aria-label="Primary">
      <ul class="nav-list">
        {% for label, href in nav_items %}
        <li><a href="{{ href }}">{{ label }}</a></li>
        {% endfor %}
      </ul>
      <a class="btn btn-small btn-accent nav-cta" href="{{ profile.resume_path }}" download>
        Resume
      </a>
    </nav>
  </div>
</header>
