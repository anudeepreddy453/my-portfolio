<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>Location access required — {{ profile.short_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,560;640&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/gate.css?v=gate-2">
</head>
<body data-rate-limited="{{ '1' if rate_limited else '0' }}">
  <div class="gate" id="gate">
    <div class="gate-bg" aria-hidden="true">
      <img src="{{ profile.hero_image }}" alt="">
      <div class="gate-bg-copy">
        <p>{{ profile.short_name }}</p>
        <p>Software Engineer</p>
      </div>
    </div>
    <div class="gate-dim" aria-hidden="true"></div>

    <section class="gate-card" role="dialog" aria-modal="true" aria-label="Allow to continue">
      <p class="gate-status" id="gate-status" role="status" aria-live="polite"></p>
      <button class="gate-button" id="gate-enable" type="button">Allow to continue</button>
      <noscript>
        <p class="gate-noscript">JavaScript is required to continue.</p>
      </noscript>
    </section>
  </div>
  <script src="/js/gate.js?v=gate-2" defer></script>
</body>
</html>
