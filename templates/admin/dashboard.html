<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Visitor intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/admin.css?v=admin-8">
</head>
<body class="admin-body">
  <div class="ambient" aria-hidden="true"></div>
  <div class="shell">
    <aside class="nav glass-panel">
      <div class="brand">
        <span class="mark" aria-hidden="true">A</span>
        <div>
          <strong>Visitors</strong>
          <span>Anudeep</span>
        </div>
      </div>
      <nav aria-label="Dashboard">
        <button type="button" data-panel="overview" class="is-active">
          <i data-lucide="layout-dashboard"></i><span>Overview</span>
        </button>
        <button type="button" data-panel="live">
          <i data-lucide="radio"></i><span>Live visitors</span>
        </button>
        <button type="button" data-panel="records">
          <i data-lucide="users"></i><span>Visitor records</span>
        </button>
        <button type="button" data-panel="settings">
          <i data-lucide="settings"></i><span>Settings</span>
        </button>
      </nav>
      <div class="account">
        <span class="avatar" aria-hidden="true">AR</span>
        <div>
          <strong>Anudeep</strong>
          <span>Owner</span>
        </div>
        <button type="button" id="logout" aria-label="Sign out"><i data-lucide="log-out"></i></button>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="titles">
          <p class="greeting">Welcome back, Anudeep</p>
          <h1 id="page-title">Overview</h1>
          <p id="page-copy">Monitor your website traffic and visitor activity.</p>
        </div>
        <div class="top-actions">
          <time id="clock"></time>
          <p class="live-pill" id="live-pill"><span class="dot"></span><span id="live-label">Checking</span></p>
          <button type="button" id="refresh" class="icon-btn" aria-label="Refresh"><i data-lucide="refresh-cw"></i></button>
          <button type="button" id="logout-mobile" class="icon-btn" aria-label="Sign out"><i data-lucide="log-out"></i></button>
        </div>
      </header>
      <div id="storage-banner" class="toast glass-panel" hidden>
        <i data-lucide="database"></i>
        <p id="storage-text"></p>
        <button type="button" id="storage-dismiss">Dismiss</button>
      </div>
      <main>
        <section id="panel-overview" class="panel"></section>
        <section id="panel-live" class="panel" hidden></section>
        <section id="panel-records" class="panel" hidden></section>
        <section id="panel-settings" class="panel" hidden></section>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="/js/admin.js?v=admin-8"></script>
</body>
</html>
